$("bRep").onclick=function(){speak(chunkText())};
$("bDic").onclick=function(){dic=!dic;this.classList.toggle("on",dic);if(!dic)cancelSpeech();else speak(chunkText())};
function askMic(ok){
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus("⚠️ Esta página no puede pedir el micrófono porque no está abierta desde un link https (o está dentro de otra app/archivo descargado). Abrila desde el link https directamente en Chrome.");return}
  setStatus("Pidiendo permiso del micrófono… tocá «Permitir».");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){st.getTracks().forEach(function(t){t.stop()});ok()}).catch(function(e){
    setStatus(e&&e.name==="NotAllowedError"?"🚫 Permiso denegado o bloqueado. Tocá el candado junto a la dirección → Permisos → Micrófono → Permitir, y recargá. Si estás dentro de otra app, abrilo directo en Chrome.":"No pude acceder al micrófono ("+(e&&e.name)+").")})
}
$("bMic").onclick=function(){if(paused)return setStatus("⏸ Estás en pausa. Tocá Reanudar.");listening?stopRec():askMic(startRec)};
function remind(){var c=chunks[ci];if(!c)return;var e=D.rem==="c"?c.e:toks.length;speak(toks.slice(Math.max(ptr,c.s),e).join(" "))}
setInterval(function(){if(paused||!listening||speaking||done||!toks.length||!dic)return;if(Date.now()-lastProg>D.stall*1000){lastProg=Date.now();remind()}},500);
function togglePause(){var b=$("bPause");
  if(!paused){paused=true;wasL=listening;cancelSpeech();listening=false;if(rec){try{rec.stop()}catch(x){}}
    $("bMic").classList.remove("on");b.textContent="▶ Reanudar";b.classList.add("on");$("main").style.opacity=.45;
    setStatus("⏸ En pausa. Tocá Reanudar para seguir donde quedaste.")}
  else{paused=false;b.textContent="🔇 Silenciarme / Pausa";b.classList.remove("on");$("main").style.opacity=1;
    lastProg=Date.now();last=[];off=0;base=ptr;
    if(done){clearTimeout(timer);timer=setTimeout(nextLine,500)}
    else if(wasL)startRec();else speak(chunkText())}}
$("bPause").onclick=togglePause;
$("main").onclick=function(e){var i=e.target.getAttribute&&e.target.getAttribute("data-i");if(i===null||i===undefined)return;
  i=+i;ptr=i;done=false;for(var k=0;k<chunks.length;k++)if(i>=chunks[k].s&&i<chunks[k].e)ci=k;
  base=ptr;off=last.length;render();speak(chunkText())};
$("bCfg").onclick=function(){var c=$("cfg");c.style.display=c.style.display==="flex"?"none":"flex"};
function applyCfg(){document.documentElement.style.setProperty("--fs",D.fs+"px");["thr","win","pause","rate","fs","stall","crate","hold"].forEach(function(k){$("s_"+k).value=D[k];$("v_"+k).textContent=D[k]});$("s_ign").checked=!!D.ign;$("s_full").checked=!!D.full;$("s_cue").checked=!!D.cue;if(window.speechSynthesis)pickVoice();$("s_rem").value=D.rem}
["thr","win","pause","rate","fs","stall","crate","hold"].forEach(function(k){$("s_"+k).oninput=function(){D[k]=parseFloat(this.value);save();applyCfg()}});
$("s_ign").onchange=function(){D.ign=this.checked?1:0;save()};$("s_cue").onchange=function(){D.cue=this.checked?1:0;save()};$("s_voice").onchange=function(){D.voice=this.value;save();pickVoice();testVoice()};
$("bTest").onclick=testVoice;
function testVoice(){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();speechSynthesis.speak(mk("Así voy a dictarte el guion. Bueno, para empezar, elegimos Half-Life dos.",D.rate))}
$("s_full").onchange=function(){D.full=this.checked?1:0;save()};$("s_rem").onchange=function(){D.rem=this.value;save()};
$("bRst").onclick=function(){D=Object.assign({},DEF);save();applyCfg()};
try{if(navigator.wakeLock)navigator.wakeLock.request("screen")}catch(x){}
applyCfg();load(false);
setStatus("Tocá 🎤 Escuchar para empezar (con auricular puesto).");
</script></body></html>
